<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cava · Standard69</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  /* base · gris frío de gestión */
  --fondo:#EEF1F5; --blanco:#FFFFFF; --tinta:#101828; --tinta2:#344054;
  --gris:#667085; --grisclaro:#98A2B3; --linea:#E4E7EC; --lineafuerte:#D0D5DD;
  /* semánticos · cada color significa una acción, no decora */
  --verde:#0B6B45;  --verdebg:#E7F4EE;  --verdeln:#A6DFC4;   /* salud / oportunidad */
  --rojo:#A72C1F;   --rojobg:#FBEAE7;   --rojoln:#F2B8AE;    /* plata que se pierde */
  --ambar:#B54708;  --ambarbg:#FDF3E7;  --ambarln:#F5CFA0;   /* atención */
  --indigo:#3538CD; --indigobg:#EEF0FC; --indigoln:#BFC4F5;  /* acción sugerida por el sistema */
  --teal:#0E7090;   --tealbg:#E6F3F8;   --tealln:#A8D6E8;    /* dato de contexto */
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--fondo);color:var(--tinta);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:14px;line-height:1.45}
.app{display:flex;align-items:flex-start;min-height:100vh}

/* ---- SIDEBAR ---- */
.sidebar{width:216px;min-width:216px;background:var(--tinta);color:#fff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 12px}
.sidebar .logo{font-size:15px;font-weight:700;letter-spacing:-0.01em;padding:4px 10px 18px;color:#fff}
.sidebar nav{display:flex;flex-direction:column;gap:2px}
.sidebar nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:none;background:transparent;color:rgba(255,255,255,.72);
  padding:9px 10px;border-radius:8px;font-size:13px;cursor:pointer;font-weight:500;font-family:inherit}
.sidebar nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.sidebar nav button.on{background:rgba(255,255,255,.12);color:#fff;font-weight:600}
.sidebar nav button .vemoji{width:20px;font-size:14px;flex:none;text-align:center;filter:grayscale(0.15)}
.sidebar nav button .dot{width:7px;height:7px;border-radius:2px;background:transparent;flex:none}
.sidebar nav button.on .dot{background:var(--verdeln)}
.sidebar .user{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;gap:10px}
.sidebar .uinfo{display:flex;align-items:center;gap:9px;padding:0 4px}
.sidebar .avatar{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;color:#fff;flex:none}
.sidebar .uname{font-size:12.5px;font-weight:600;color:#fff;line-height:1.2}
.sidebar .urol{font-size:11px;color:rgba(255,255,255,.55)}
.sidebar .logout{border:1px solid rgba(255,255,255,.22);background:transparent;color:rgba(255,255,255,.8);padding:7px 10px;border-radius:8px;
  font-size:12px;cursor:pointer;font-weight:500;font-family:inherit}
.sidebar .logout:hover{background:rgba(255,255,255,.08);color:#fff}

/* ---- CONTENIDO ---- */
.content{flex:1;min-width:0;padding:18px 22px 40px;max-width:1180px}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:19px;font-weight:700;letter-spacing:-0.01em}
.topbar .sucs{margin-left:auto;margin-bottom:0}

/* ---- FILTRO DE FECHAS ---- */
.filtros{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.segm{display:flex;background:var(--blanco);border:1px solid var(--linea);border-radius:10px;padding:3px;gap:2px}
.segm button{border:none;background:transparent;padding:6px 12px;border-radius:7px;font-size:12.5px;color:var(--gris);cursor:pointer;
  font-weight:500;white-space:nowrap;font-family:inherit}
.segm button:hover{color:var(--tinta)}
.segm button.on{background:var(--tinta);color:#fff;font-weight:600}
.rango{font-size:12px;color:var(--gris);background:var(--blanco);border:1px solid var(--linea);padding:6px 12px;border-radius:99px;white-space:nowrap}

/* ---- NAV MOBILE ---- */
.mobilenav{display:none}
@media(max-width:900px){
  .sidebar{display:none}
  .content{padding:14px 14px 78px;max-width:100%}
  .mobilenav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--tinta);padding:8px 10px;gap:4px;
    overflow-x:auto;z-index:50;-webkit-overflow-scrolling:touch}
  .mobilenav button{border:none;background:transparent;color:rgba(255,255,255,.7);padding:8px 13px;border-radius:8px;font-size:12.5px;
    white-space:nowrap;cursor:pointer;font-weight:500;font-family:inherit}
  .mobilenav button.on{background:rgba(255,255,255,.14);color:#fff;font-weight:600}
}
.sucs{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}
.sucs button{border:1px solid var(--linea);background:var(--blanco);padding:5px 13px;border-radius:99px;font-size:12.5px;cursor:pointer;color:var(--gris);font-weight:500}
.sucs button.on{border-color:var(--tinta);background:var(--tinta);color:#fff;font-weight:600}

/* ---- jerarquía visual: 3 niveles ---- */
/* nivel 1 · titular: el número que define la salud del negocio */
.titular{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:900px){.titular{grid-template-columns:1fr}}
.tcard{background:var(--blanco);border:1px solid var(--linea);border-radius:14px;padding:20px 22px;display:flex;flex-direction:column;justify-content:center;min-height:132px}
.tcard.hero{background:var(--tinta);border-color:var(--tinta);color:#fff}
.tcard.hero .lbl{color:rgba(255,255,255,.6)}
.tcard.hero .val{color:#fff}
.tcard.hero .det{color:rgba(255,255,255,.68)}
.tcard .lbl{font-size:11px;font-weight:700;color:var(--gris);text-transform:uppercase;letter-spacing:0.06em}
.tcard .val{font-size:38px;font-weight:700;letter-spacing:-0.03em;line-height:1.05;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.tcard.hero .val{font-size:42px}
.tcard .det{font-size:12px;color:var(--gris)}

/* ---- cockpit: 2 columnas ---- */
.cockpit{display:grid;grid-template-columns:1.55fr 1fr;gap:12px;align-items:start}
@media(max-width:900px){.cockpit{grid-template-columns:1fr}}

/* ---- barra apilada de capital ---- */
.stack{display:flex;height:28px;border-radius:8px;overflow:hidden;margin-bottom:14px}
.stack>div{display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:#fff;overflow:hidden;white-space:nowrap}
.leyenda{display:flex;flex-direction:column;gap:9px}
.leyenda .lrow{display:flex;align-items:center;gap:9px}
.leyenda .pt{width:9px;height:9px;border-radius:3px;flex:none}
.leyenda .lnom{font-size:13px;font-weight:600}
.leyenda .ldet{font-size:11.5px;color:var(--grisclaro)}
.leyenda .lmonto{margin-left:auto;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---- barra de totales (inventario) ---- */
.totbar{display:flex;background:#F2F4F7;border:1px solid var(--linea);border-radius:10px;margin-bottom:12px;overflow:hidden;flex-wrap:wrap}
.totbar .tb{padding:12px 18px;border-right:1px solid var(--linea);flex:none}
.totbar .tb:last-child{border-right:none;flex:1;min-width:200px;display:flex;align-items:center}
.totbar .tlbl{font-size:10.5px;font-weight:700;color:var(--gris);text-transform:uppercase;letter-spacing:0.05em}
.totbar .tval{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-0.01em}
.totbar .tnota{font-size:12px;color:var(--gris)}

/* ---- precios: card destacada + tabla ---- */
.preciosgrid{display:grid;grid-template-columns:270px 1fr;gap:12px;align-items:start}
@media(max-width:900px){.preciosgrid{grid-template-columns:1fr}}
.perdida{background:var(--rojobg);border:1px solid var(--rojoln);border-radius:14px;padding:20px}
.perdida .lbl{font-size:11px;font-weight:700;color:var(--rojo);text-transform:uppercase;letter-spacing:0.06em;line-height:1.35}
.perdida .val{font-size:34px;font-weight:700;color:var(--rojo);letter-spacing:-0.03em;margin:8px 0 4px;font-variant-numeric:tabular-nums}
.perdida .det{font-size:12px;color:var(--rojo);opacity:.85;margin-bottom:16px}
.perdida .btns{display:flex;flex-direction:column;gap:8px}
.perdida .btns .btn{width:100%}
.t1 .lbl{font-size:11px;font-weight:700;color:var(--gris);text-transform:uppercase;letter-spacing:0.06em}
.t1 .val{font-size:42px;font-weight:700;letter-spacing:-0.03em;line-height:1.05;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.t1 .det{font-size:12.5px;color:var(--gris)}
.t2 .lbl{font-size:11px;font-weight:700;color:var(--gris);text-transform:uppercase;letter-spacing:0.06em}
.t2 .val{font-size:27px;font-weight:700;letter-spacing:-0.02em;margin:3px 0 1px;font-variant-numeric:tabular-nums}
.t2 .det{font-size:12px;color:var(--grisclaro)}
.sep{border-left:1px solid var(--linea);padding-left:28px}
@media(max-width:820px){.sep{border-left:none;border-top:1px solid var(--linea);padding-left:0;padding-top:18px}}
.alerta .leido{font-size:12px;font-weight:600;color:var(--gris);border:1px solid var(--linea);background:transparent;padding:6px 10px;border-radius:7px;cursor:pointer;white-space:nowrap}
.alerta .leido:hover{background:var(--fondo);color:var(--tinta)}
.novacio{font-size:13px;color:var(--grisclaro);padding:14px 4px}

/* nivel 2 · alertas accionables, ordenadas por plata en juego */
.alertas{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.alerta{background:var(--blanco);border:1px solid var(--linea);border-left:4px solid var(--gris);border-radius:10px;padding:13px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.alerta.rojo{border-left-color:var(--rojo)}
.alerta.ambar{border-left-color:var(--ambar)}
.alerta.indigo{border-left-color:var(--indigo)}
.alerta.verde{border-left-color:var(--verde)}
.alerta .plata{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;min-width:105px;letter-spacing:-0.01em}
.alerta.rojo .plata{color:var(--rojo)} .alerta.ambar .plata{color:var(--ambar)}
.alerta.indigo .plata{color:var(--indigo)} .alerta.verde .plata{color:var(--verde)}
.alerta .txt{flex:1;min-width:220px;font-size:13px}
.alerta .txt b{font-weight:650}
.alerta .txt .sub{display:block;font-size:12px;color:var(--gris);margin-top:1px}
.alerta .cta{font-size:12px;font-weight:600;color:var(--tinta);border:1px solid var(--lineafuerte);background:transparent;padding:6px 12px;border-radius:7px;cursor:pointer;white-space:nowrap}
.alerta .cta:hover{background:var(--fondo)}

/* nivel 3 · paneles de detalle */
.panel{background:var(--blanco);border:1px solid var(--linea);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.panel h2{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--tinta2);margin-bottom:3px}
.panel .h2sub{font-size:12px;color:var(--gris);margin-bottom:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px;margin-bottom:12px}
.card{background:var(--blanco);border:1px solid var(--linea);border-radius:12px;padding:13px 15px}
.card .lbl{font-size:10.5px;font-weight:700;color:var(--gris);text-transform:uppercase;letter-spacing:0.05em}
.card .val{font-size:23px;font-weight:700;letter-spacing:-0.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.card .det{font-size:11.5px;color:var(--grisclaro);margin-top:1px}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;color:var(--gris);text-transform:uppercase;letter-spacing:0.05em;font-weight:700;padding:7px 10px;border-bottom:1px solid var(--lineafuerte);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--linea);font-variant-numeric:tabular-nums;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#FAFBFC}
.num{text-align:right} th.num{text-align:right}
.etq{font-weight:600}
.mini{font-size:11.5px;color:var(--grisclaro)}
.tot td{border-top:2px solid var(--tinta);font-weight:700;background:#FAFBFC}

.tag{display:inline-block;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.tag.joya{background:var(--verdebg);color:var(--verde);border-color:var(--verdeln)}
.tag.vidriera{background:var(--tealbg);color:var(--teal);border-color:var(--tealln)}
.tag.revisar{background:var(--indigobg);color:var(--indigo);border-color:var(--indigoln)}
.tag.liquidar{background:var(--rojobg);color:var(--rojo);border-color:var(--rojoln)}
.tag.atencion{background:var(--ambarbg);color:var(--ambar);border-color:var(--ambarln)}
.tag.g{background:#F2F4F7;color:var(--gris);border-color:var(--linea)}
.pos{color:var(--verde);font-weight:650}.neg{color:var(--rojo);font-weight:650}
.sug{color:var(--indigo);font-weight:700}

/* barras */
.barra{height:6px;background:#EAECF0;border-radius:3px;overflow:hidden;min-width:56px}
.barra>div{height:100%;background:var(--tinta2);border-radius:3px}
.barra>div.t{background:var(--teal)}
.pbar{height:14px;background:#EAECF0;border-radius:7px;overflow:hidden;position:relative}
.pbar>div{height:100%;border-radius:7px}
.pbar.verde>div{background:var(--verde)} .pbar.ambar>div{background:var(--ambar)} .pbar.rojo>div{background:var(--rojo)}
.presu{margin-bottom:16px}
.presu .f1{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;gap:10px;flex-wrap:wrap}
.presu .suc{font-weight:650;font-size:13.5px}
.presu .nums{font-size:12.5px;color:var(--gris);font-variant-numeric:tabular-nums}
.presu .dif{font-size:11.5px;color:var(--grisclaro);margin-top:5px}

.nota{font-size:12px;color:var(--gris);background:#F8F9FB;border:1px solid var(--linea);border-radius:8px;padding:9px 12px;margin-top:12px}
.nota.info{background:var(--tealbg);border-color:var(--tealln);color:var(--teal)}
.btn{background:var(--tinta);color:#fff;border:none;padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.btn.sec{background:transparent;color:var(--tinta);border:1px solid var(--lineafuerte)}
.btn.acc{background:var(--indigo)}
.selper{border:1px solid var(--lineafuerte);border-radius:7px;padding:6px 9px;font-size:12.5px;background:var(--blanco);max-width:100%}
.dropzone{border:2px dashed var(--lineafuerte);border-radius:12px;padding:22px;text-align:center;color:var(--gris);background:#FAFBFC}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.banner{background:var(--ambarbg);color:var(--ambar);border:1px solid var(--ambarln);font-size:12px;padding:7px 14px;border-radius:8px;margin-bottom:12px;font-weight:600}
.acuerdo{border:1px solid var(--linea);border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start}
.acuerdo .bod{font-weight:650}
/* ---- LOGIN ---- */
#login{position:fixed;inset:0;background:var(--tinta);display:flex;align-items:center;justify-content:center;z-index:200}
#login .box{background:var(--blanco);border-radius:16px;padding:34px 32px;width:340px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.3)}
#login .lg{font-size:20px;font-weight:700;letter-spacing:-0.01em;margin-bottom:4px}
#login .sb{font-size:12.5px;color:var(--gris);margin-bottom:22px}
#login label{display:block;font-size:11px;font-weight:700;color:var(--gris);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:5px}
#login input{width:100%;border:1px solid var(--lineafuerte);border-radius:9px;padding:10px 12px;font-size:14px;margin-bottom:14px;font-family:inherit}
#login input:focus{outline:none;border-color:var(--tinta)}
#login .btn{width:100%;padding:11px;font-size:14px}
#login .err{font-size:12.5px;color:var(--rojo);margin-bottom:12px;display:none}
#login .err.show{display:block}
/* ---- CONTEO FISICO ---- */
.conteo-row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--linea)}
.conteo-row:last-child{border-bottom:none}
.conteo-row .cetq{flex:1;min-width:0}
.conteo-row input{width:86px;border:1px solid var(--lineafuerte);border-radius:9px;padding:10px;font-size:17px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums;font-family:inherit}
.conteo-row input:focus{outline:none;border-color:var(--tinta)}
.conteo-row input.lleno{background:var(--verdebg);border-color:var(--verdeln)}
.stepbtn{width:38px;height:38px;border-radius:9px;border:1px solid var(--lineafuerte);background:var(--blanco);font-size:17px;font-weight:700;cursor:pointer;color:var(--tinta2);flex:none}
.stepbtn:active{background:var(--fondo)}
.difpos{color:var(--verde);font-weight:700}
.difneg{color:var(--rojo);font-weight:700}
.causasel{border:1px solid var(--lineafuerte);border-radius:7px;padding:6px 8px;font-size:12px;background:var(--blanco);font-family:inherit;max-width:150px}
.pasos{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.paso{font-size:12px;font-weight:600;padding:6px 12px;border-radius:99px;border:1px solid var(--linea);background:var(--blanco);color:var(--gris)}
.paso.on{background:var(--tinta);border-color:var(--tinta);color:#fff}
.paso.hecho{background:var(--verdebg);border-color:var(--verdeln);color:var(--verde)}
/* ---- sub-secciones dentro de una vista ---- */
.subnav{display:flex;gap:6px;margin-bottom:18px;background:#D3DAE3;padding:6px;border-radius:13px;flex-wrap:wrap}
.subnav button{display:flex;align-items:center;gap:9px;border:none;background:transparent;padding:12px 20px;border-radius:9px;font-size:14px;color:var(--tinta2);cursor:pointer;font-weight:600;font-family:inherit;flex:1;justify-content:center;min-width:150px}
.subnav button:hover{color:var(--tinta);background:rgba(255,255,255,.55)}
.subnav button .sico{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;background:rgba(16,24,40,.12);color:var(--tinta2);flex:none}
.subnav button.on{color:#fff;box-shadow:0 3px 10px rgba(16,24,40,.18)}
.subnav button.on.stock{background:var(--tinta)}
.subnav button.on.conteo{background:var(--teal)}
.subnav button.on.merma{background:var(--rojo)}
.subnav button.on .sico{background:rgba(255,255,255,.22);color:#fff}
.subnav button .sbadge{background:var(--rojo);color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;margin-left:2px}
.subnav button.on.merma .sbadge{background:#fff;color:var(--rojo)}
.secband{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
.secband .ico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.secband .st{font-size:15px;font-weight:700}
.secband .ss{font-size:12px;color:var(--gris)}
</style>
</head>
<body>
<div id="login">
  <div class="box">
    <div class="lg">Cava · Standard69</div>
    <div class="sb">Gestión y análisis de vinos</div>
    <div class="err" id="lerr">Usuario o contraseña incorrectos</div>
    <label>Usuario</label>
    <input id="luser" type="text" autocomplete="username" autofocus>
    <label>Contraseña</label>
    <input id="lpass" type="password" autocomplete="current-password">
    <button class="btn" id="lbtn">Entrar</button>
  </div>
</div>
<div class="app" id="app" style="display:none">
  <aside class="sidebar">
    <div class="logo">Cava · S69</div>
    <nav id="vistas"></nav>
    <div class="user">
      <div class="uinfo">
        <div class="avatar">WO</div>
        <div><div class="uname">Willy O.</div><div class="urol">Gerente general · <span id="conn">demo</span></div></div>
      </div>
      <button class="logout">⏻ Cerrar sesión</button>
    </div>
  </aside>
  <main class="content">
    <div class="banner">MOCKUP · datos reales de compras (Warcalde jun-26) + ventas simuladas · el resto es demostrativo</div>
    <div class="topbar">
      <h1 id="titulo">Resumen</h1>
      <div class="sucs" id="sucs"></div>
    </div>
    <div class="filtros" id="filtros"></div>
    <div id="main"></div>
  </main>
</div>

// ================= CÁLCULO =================
function sucsDe(){return state.suc==='consolidado'?['guemes','warcalde','neper']:[state.suc];}
function stockEn(id,s){return (state.stock[id]||{})[s]||0;}
function costoRepo(b){return b.costo>0?b.costo:(b.costoRef||0);}   // bonificada → costo de referencia
const COPAS_POR_BOTELLA=5;   // equivalencia fija: 5 copas = 1 botella (definido con Willy)
function filas(){
  return state.botellas.map(b=>{
    const ss=sucsDe();
    const st=ss.reduce((a,s)=>a+stockEn(b.id,s),0);
    const vBot=ss.reduce((a,s)=>a+((state.ventas[b.id]||{})[s]||0),0);          // botellas enteras
    const vCopas=ss.reduce((a,s)=>a+((state.copas[b.id]||{})[s]||0),0);         // copas sueltas
    const vCopasEq=vCopas/COPAS_POR_BOTELLA;                                     // copas → botellas-equivalentes
    const v=vBot+vCopasEq;                                                       // demanda total en botellas
    let precio=null; for(const s of ss){ if(b.precio[s]){precio=b.precio[s];break;} }
    let precioCopa=null; for(const s of ss){ if((state.precioCopa[b.id]||{})[s]){precioCopa=(state.precioCopa[b.id])[s];break;} }
    const cr=costoRepo(b);
    const capital=st*b.costo;                       // lo que pagaste (bonificadas = 0)
    const capitalRepo=st*cr;                        // a costo de reposición
    const margen=precio&&cr?precio-cr:null;
    const margenPct=precio&&cr?(precio-cr)/precio*100:null;
    // margen de la copa: se calcula contra costo/5, pero es SUPERIOR al de botella
    // (las 5 copas juntas rinden más que la botella entera). Se muestra aparte, no mezclado.
    const margenCopa=precioCopa&&cr?precioCopa-cr/COPAS_POR_BOTELLA:null;
    // COBERTURA / ROTACION: promedio de ventas de los ULTIMOS 3 MESES (botellas + copas convertidas).
    // Incluir las copas es clave: un vino que rota por copa y no por botella (ej. Montfleury)
    // se vería como 'no rota' si solo contáramos botellas enteras.
    const rot=st>0?v/st:(v>0?9:0);
    const meses=v>0?st/v:null;   // cobertura = stock / demanda mensual promedio (3m, botellas+copas)
    return {b,st,v,vBot,vCopas,vCopasEq,precio,precioCopa,cr,capital,capitalRepo,margen,margenPct,margenCopa,rot,meses};
  }).filter(f=>f.st>0||f.v>0);
}
function cuadrante(f){
  const mAlto=f.margenPct!=null&&f.margenPct>=60, rAlta=f.rot>=0.5;
  if(mAlto&&rAlta) return {t:'joya',l:'Joya'};
  if(mAlto&&!rAlta) return {t:'vidriera',l:'Vidriera'};
  if(!mAlto&&rAlta) return {t:'revisar',l:'Subir precio'};
  return {t:'liquidar',l:'No reponer'};
}
// transferencias NO registradas: stock negativo = vendió sin tener
function transfDetectadas(){
  const out=[];
  for(const b of state.botellas){
    for(const s of ['guemes','warcalde','neper']){
      const st=stockEn(b.id,s);
      if(st>=0) continue;
      const donde=['guemes','warcalde','neper'].filter(x=>x!==s&&stockEn(b.id,x)>0)
        .map(x=>({suc:x,st:stockEn(b.id,x)}));
      out.push({b,suc:s,faltan:-st,donde,capital:-st*costoRepo(b)});
    }
  }
  return out.sort((a,b)=>b.capital-a.capital);
}
// transferencias QUE CONVIENE hacer: duerme en una cava, vuela en otra
function transfSugeridas(){
  const out=[];
  const cob=(id,s)=>{const st=stockEn(id,s),v=(state.ventas[id]||{})[s]||0;
    return {st,v,meses:v>0?st/v:(st>0?99:null)};};
  for(const b of state.botellas){
    for(const o of ['guemes','warcalde','neper']){
      const co=cob(b.id,o);
      if(co.st<2||co.meses===null||co.meses<4) continue;      // no duerme
      for(const d of ['guemes','warcalde','neper']){
        if(d===o) continue;
        const cd=cob(b.id,d);
        if(cd.v<=0||cd.meses===null||cd.meses>1.5) continue;  // no vuela allá
        const sug=Math.max(1,Math.min(Math.floor(co.st/2),Math.ceil(cd.v*2-cd.st)));
        out.push({b,origen:o,destino:d,stO:co.st,mesesO:co.meses,stD:cd.st,mesesD:cd.meses,
                  vendeD:cd.v,sug,capital:sug*costoRepo(b)});
      }
    }
  }
  return out.sort((a,b)=>b.capital-a.capital);
}
// margen objetivo = el que tenías antes de que subiera el costo
function trasladoPendiente(){
  return state.botellas.filter(b=>b.costoAnt&&b.precio.guemes).map(b=>{
    const p=b.precio.guemes, c0=b.costoAnt, c1=b.costo;
    const m0=(p-c0)/p*100, m1=(p-c1)/p*100;
    const sug=Math.round(c1/(1-m0/100));
    const st=['guemes','warcalde','neper'].reduce((a,s)=>a+stockEn(b.id,s),0);
    const v=['guemes','warcalde','neper'].reduce((a,s)=>a+((state.ventas[b.id]||{})[s]||0),0);
    return {b,precio:p,c0,c1,var:(c1/c0-1)*100,m0,m1,ero:m0-m1,sug,subaNec:(sug/p-1)*100,
            platanoAnual:Math.round((sug-p)*v*12)};   // plata que dejás de ganar por año
  }).filter(t=>t.ero>3).sort((a,b)=>b.platanoAnual-a.platanoAnual);
}

      +'<span class="sub">el stock físico está, falta el costo — se completa cuando entre la factura y se mapee</span>',
    cta:'Ver inventario'});
  const joyas=fs.filter(f=>cuadrante(f).t==='joya').sort((a,b)=>b.v*b.margen-a.v*a.margen);
  if(joyas.length) novedades.push({id:'joya-'+joyas[0].b.id, tipo:'indigo', plata:joyas[0].v*joyas[0].margen,
    txt:'<b>'+esc(joyas[0].b.etiqueta)+'</b> es tu joya: margen '+joyas[0].margenPct.toFixed(0)+'% y rota '+joyas[0].rot.toFixed(1)+'×'
      +'<span class="sub">deja '+fmtM(joyas[0].v*joyas[0].margen)+'/mes · asegurate de no quedarte sin stock</span>',
    cta:'Ver stock'});

  const pendientes=novedades.filter(n=>!state.leidas.has(n.id)).sort((a,b)=>{
    // las de plata 0 (avisos sin monto en juego) van al final
    if((a.plata===0)!==(b.plata===0)) return a.plata===0?1:-1;
    return Math.abs(b.plata)-Math.abs(a.plata);
  });
  html+='<div class="cockpit">';

  // izquierda · qué atender ahora
  html+='<section class="panel"><h2>Qué atender ahora</h2>'
    +'<div class="h2sub">Ordenado por plata en juego · «Leído» lo retira hasta que haya un cambio nuevo</div>';
  if(pendientes.length){
    html+='<div class="alertas" style="margin-bottom:0">';
    for(const a of pendientes) html+='<div class="alerta '+a.tipo+'"><span class="plata">'+fmtM(a.plata)+'</span>'
      +'<span class="txt">'+a.txt+'</span><button class="cta">'+a.cta+'</button>'
      +'<button class="leido" data-leido="'+a.id+'">✓ Leído</button></div>';
    html+='</div>';
  } else {
    html+='<div class="novacio">No hay novedades pendientes — todo lo del mes está leído. Vuelven a aparecer si algo cambia.</div>';
  }
  html+='</section>';

  // derecha · capital por cava (barra apilada + leyenda)
  const rs=s=>{let b=0,c=0,e=0;for(const x of state.botellas){const st=stockEn(x.id,s);if(st>0){b+=st;c+=st*costoRepo(x);e++;}}return{b,c,e};};
  const g=rs('guemes'),w=rs('warcalde'),n=rs('neper'),tot=g.c+w.c+n.c;
  const segs=[['Güemes',g,'var(--teal)'],['Warcalde',w,'var(--tinta2)'],['Neper',n,'var(--grisclaro)']];
  html+='<section class="panel"><h2>Capital por cava</h2><div class="h2sub">Dónde está la plata</div>'
    +'<div class="stack">'
    + segs.map(([nm,r,col])=>{
        const pct=tot?r.c/tot*100:0;
        return '<div style="width:'+pct+'%;background:'+col+'">'+(pct>=12?Math.round(pct)+'%':'')+'</div>';
      }).join('')
    +'</div>'
    +'<div class="leyenda">'
    + segs.map(([nm,r,col])=>
        '<div class="lrow"><span class="pt" style="background:'+col+'"></span>'
        +'<span><span class="lnom">'+nm+'</span><br><span class="ldet">'+r.b+' botellas · '+r.e+' etiquetas</span></span>'
        +'<span class="lmonto">'+fmt$(r.c)+'</span></div>').join('')
    +'<div class="lrow" style="border-top:1px solid var(--linea);padding-top:9px;margin-top:2px">'
    +'<span class="pt" style="background:var(--tinta)"></span>'
    +'<span><span class="lnom">Consolidado</span><br><span class="ldet">'+(g.b+w.b+n.b)+' botellas · '+fs.length+' etiquetas</span></span>'
    +'<span class="lmonto">'+fmt$(tot)+'</span></div>'
    +'</div>'
    +'<div class="nota">Las etiquetas del consolidado no son la suma de las tres: un vino en las 3 cavas cuenta una vez.</div></section>';

  html+='</div>';
  return html;
}

    +'<div class="tb"><div class="tlbl">Capital total</div><div class="tval">'+fmtM(capTot)+'</div></div>'

    +'<div class="tb"><div class="tlbl">Etiquetas</div><div class="tval">'+fs.length+'</div></div>'
    +'<div class="tb"><div class="tnota">Ordenado por capital inmovilizado — arriba está la plata</div></div>'
    +'</div>';
  html+='<section class="panel"><h2>Stock por etiqueta · '+nombreSuc()+'</h2>'
    +'<table><thead><tr><th>Etiqueta</th>'
    +(cons?'<th class="num">Güe</th><th class="num">War</th><th class="num">Nep</th>':'')
    +'<th class="num">'+(cons?'Total':'Stock')+'</th><th class="num">Costo repo.</th><th class="num">Capital</th><th class="num">Cobertura</th></tr></thead><tbody>';
  for(const f of fs){
    const cob=f.meses;
    const alerta=cob!=null&&cob<1?'<span class="tag atencion">se agota</span>':(cob!=null&&cob>6?'<span class="tag liquidar">'+cob.toFixed(0)+' meses</span>':(cob!=null?cob.toFixed(1)+' m':'—'));
    html+='<tr><td><span class="etq">'+esc(f.b.etiqueta)+'</span><br><span class="mini">'+esc(f.b.bodega)+' · '+esc(f.b.cepa)+'</span></td>'
      +(cons?'<td class="num">'+(stockEn(f.b.id,'guemes')||'—')+'</td><td class="num">'+(stockEn(f.b.id,'warcalde')||'—')+'</td><td class="num">'+(stockEn(f.b.id,'neper')||'—')+'</td>':'')
      +'<td class="num"><b>'+fmtBot(f.st)+'</b></td>'
      +'<td class="num">'+(f.b.bonif?'<span class="tag joya">bonif.</span>':fmt$(f.cr))+'</td>'
      +'<td class="num"><b>'+fmt$(f.capitalRepo)+'</b></td>'
      +'<td class="num">'+alerta+'</td></tr>';
  }
  html+='<tr class="tot"><td>Total</td>'+(cons?'<td colspan="3"></td>':'')
    +'<td class="num">'+fmtBot(fs.reduce((a,f)=>a+f.st,0))+'</td><td></td><td class="num">'+fmt$(fs.reduce((a,f)=>a+f.capitalRepo,0))+'</td><td></td></tr>'
    +'</tbody></table>'
    +'<div class="nota info"><b>Cobertura</b> = meses que tardás en vender el stock actual al ritmo de venta promedio de los <b>últimos 3 meses</b> (suaviza los picos de un mes suelto). Menos de 1 mes: riesgo de quiebre. Más de 6: capital dormido.<br><span style="opacity:.75">Nota: con un solo mes cargado, hoy usa ese mes; el promedio de 3 aplica cuando esté el histórico.</span></div></section>';

  html+='<section class="panel"><h2>Valorización mes a mes</h2><div class="h2sub">La serie que se congela en cada cierre — no se recalcula aunque cambien los costos</div>'
    +'<table><thead><tr><th>Mes</th><th class="num">Güemes</th><th class="num">Warcalde</th><th class="num">Neper</th><th class="num">Total</th><th class="num">Var.</th></tr></thead><tbody>';
  let prev=null;
  for(const c of state.cierres){
    const t=c.g+c.w+c.n;
    const varr=prev?((t/prev-1)*100):null;
    html+='<tr><td class="etq">'+c.mes+'</td><td class="num">'+fmtM(c.g)+'</td><td class="num">'+fmtM(c.w)+'</td><td class="num">'+fmtM(c.n)+'</td>'
      +'<td class="num"><b>'+fmtM(t)+'</b></td>'
      +'<td class="num '+(varr>0?'neg':'pos')+'">'+(varr!=null?fmtPct(varr):'—')+'</td></tr>';
    prev=t;
  }
  html+='</tbody></table><div class="nota">La cava creció 21% en cinco meses. Parte es inflación de costos, parte es más stock: el desglose está en Precios.</div></section>';
  return html;
}

function vTransf(){

  if(det.length){
    html+='<section class="panel" style="border-color:var(--rojoln)"><h2 style="color:var(--rojo)">Transferencias no registradas · '+det.length+'</h2>'
      +'<div class="h2sub">Estas cavas vendieron botellas que nunca compraron. Alguien las movió y no quedó asentado — hasta regularizarlo, el stock y el margen de las dos cavas están mal.</div>'
      +'<table><thead><tr><th>Etiqueta</th><th>Vendió sin stock</th><th class="num">Faltan</th><th>Hay stock en</th><th class="num">Capital</th><th></th></tr></thead><tbody>';
    for(const d of det){
      html+='<tr><td><span class="etq">'+esc(d.b.etiqueta)+'</span><br><span class="mini">'+esc(d.b.bodega)+'</span></td>'
        +'<td><span class="tag liquidar">'+nm(d.suc)+'</span></td>'
        +'<td class="num"><b class="neg">'+d.faltan+'</b></td>'
        +'<td>'+(d.donde.length?d.donde.map(x=>nm(x.suc)+' ('+x.st+')').join(', '):'<span class="mini">ninguna otra cava</span>')+'</td>'
        +'<td class="num">'+fmt$(d.capital)+'</td>'
        +'<td>'+(d.donde.length?'<button class="btn acc" style="padding:6px 12px;font-size:12px">Registrar desde '+nm(d.donde[0].suc)+'</button>':'<span class="mini">revisar carga</span>')+'</td></tr>';
    }
    html+='</tbody></table>'
      +'<div class="nota info"><b>Cómo lo detecta:</b> si una cava vende más de lo que compró, su stock se va a negativo. El sistema busca dónde hay stock de esa etiqueta y propone el origen. Al registrar, el costo viaja con la botella — sin eso, la cava que recibe vendería con costo $0 y su margen sería falso.</div></section>';

  html+='<section class="panel"><h2>Transferencias sugeridas</h2>'

    html+='<table><thead><tr><th>Etiqueta</th><th>Origen · duerme</th><th>Destino · vuela</th><th class="num">Mover</th><th class="num">Capital</th><th></th></tr></thead><tbody>';
    for(const s of sug){
      html+='<tr><td><span class="etq">'+esc(s.b.etiqueta)+'</span><br><span class="mini">'+esc(s.b.bodega)+'</span></td>'
        +'<td><b>'+nm(s.origen)+'</b><br><span class="mini">'+s.stO+' bot · '+(s.mesesO>50?'no vende':s.mesesO.toFixed(1)+' meses de stock')+'</span></td>'
        +'<td><b>'+nm(s.destino)+'</b><br><span class="mini">'+s.stD+' bot · vende '+s.vendeD+'/mes · '+s.mesesD.toFixed(1)+' meses</span></td>'
        +'<td class="num"><b class="sug">'+s.sug+'</b></td>'
        +'<td class="num">'+fmt$(s.capital)+'</td>'
        +'<td><button class="btn sec" style="padding:6px 12px;font-size:12px">Transferir</button></td></tr>';
    }
    html+='</tbody></table>';
  } else html+='<div class="novacio">No hay transferencias sugeridas: ninguna etiqueta duerme en una cava mientras se agota en otra.</div>';
  html+='</section>';

  html+='<section class="panel"><h2>Historial</h2><div class="h2sub">Toda transferencia deja dos movimientos: salida en origen, entrada en destino</div>'
    +'<table><thead><tr><th>Fecha</th><th>Etiqueta</th><th>Origen → Destino</th><th class="num">Bot.</th><th class="num">Costo que viajó</th><th>Origen del registro</th></tr></thead><tbody>';
  for(const t of state.transfHist){
    html+='<tr><td>'+t.fecha+'</td><td class="etq">'+esc(t.etq)+'</td>'
      +'<td>'+nm(t.origen)+' <span style="color:var(--gris)">→</span> <b>'+nm(t.destino)+'</b></td>'
      +'<td class="num">'+t.cant+'</td><td class="num">'+fmt$(t.costo)+'</td>'

  }
  html+='</tbody></table>'
    +'<div class="nota">El presupuesto de compras lo consume quien compra, no quien vende. Si transferir devolviera presupuesto, convendría comprar de más y limpiarlo mandando botellas a otra cava.</div></section>';
  return html;
}

// ================= VENTAS =================
function vVentas(){
  // margen total = botellas × margen botella + copas × margen copa (los dos canales juntos)
  const conMargen=f=>(f.vBot*(f.margen||0))+(f.vCopas*(f.margenCopa||0));
  const fs=filas().filter(f=>f.v>0).sort((a,b)=>conMargen(b)-conMargen(a));
  const max=fs.length?conMargen(fs[0]):1;
  let html='<section class="panel"><h2>Etiquetas que más margen dejan · '+nombreSuc()+'</h2>'
    +'<div class="h2sub">No es el ranking de más vendidas: es el de las que más plata dejan, sumando botella y copa. Vender 40 botellas de margen flaco puede rendir menos que 5 de margen alto.</div>'
    +'<table><thead><tr><th>#</th><th>Etiqueta</th><th class="num">Botellas</th><th class="num">Copas</th><th class="num">Margen total</th><th style="width:110px"></th></tr></thead><tbody>';
  fs.forEach((f,i)=>{
    const mt=conMargen(f);
    html+='<tr><td class="mini">'+(i+1)+'</td><td class="etq">'+esc(f.b.etiqueta)+'</td>'
      +'<td class="num">'+f.vBot+'</td>'
      +'<td class="num">'+(f.vCopas>0?f.vCopas:'—')+'</td>'
      +'<td class="num"><b>'+fmt$(mt)+'</b></td>'
      +'<td><div class="barra"><div style="width:'+Math.round(mt/max*100)+'%"></div></div></td></tr>';
  });
  html+='</tbody></table></section>';

  // ranking específico de vinos por copa
  const copasR=filas().filter(f=>f.vCopas>0).sort((a,b)=>b.vCopas-a.vCopas);
  if(copasR.length){
    const maxc=copasR[0].vCopas;
    html+='<section class="panel"><h2>Vinos por copa · '+nombreSuc()+'</h2>'
      +'<div class="h2sub">Las 5 copas juntas rinden más que la botella entera: el margen por copa es superior. Un vino puede ser flojo por botella y una máquina por copa.</div>'
      +'<table><thead><tr><th>#</th><th>Etiqueta</th><th class="num">Copas</th><th class="num">Precio copa</th><th class="num">Margen/copa</th><th class="num">Margen total</th><th style="width:90px"></th></tr></thead><tbody>';
    copasR.forEach((f,i)=>{
      const mtc=f.vCopas*(f.margenCopa||0);
      html+='<tr><td class="mini">'+(i+1)+'</td><td class="etq">'+esc(f.b.etiqueta)+'</td>'
        +'<td class="num"><b>'+f.vCopas+'</b></td>'
        +'<td class="num">'+fmt$(f.precioCopa)+'</td>'
        +'<td class="num">'+(f.margenCopa!=null?fmt$(f.margenCopa):'—')+'</td>'

  }
  const mz=state.mozos.filter(m=>state.suc==='consolidado'||m.s===state.suc).sort((a,b)=>b.bot-a.bot);
  const maxb=mz.length?mz[0].bot:1;

    +'<table><thead><tr><th>#</th><th>Mozo</th><th class="num">Botellas</th><th class="num">Copas</th><th style="width:110px"></th></tr></thead><tbody>';
  mz.forEach((m,i)=>{

      +'<td><div class="barra"><div style="width:'+Math.round(m.bot/maxb*100)+'%"></div></div></td></tr>';

  html+='</tbody></table></section>';
  return html;

// costo efectivo de reponer una botella hoy, con acuerdo aplicado
function costoEfectivo(botId){
  const b=state.botellas.find(x=>x.id===botId); if(!b) return {costo:0,acuerdo:null};
  const base=costoRepo(b);
  const ac=state.acuerdosCalc[botId];
  if(!ac) return {costo:base, acuerdo:null};
  let c=base;
  if(ac.descuento_pct) c=c*(1-ac.descuento_pct/100);
  if(ac.compra_x && ac.bonif_y) c=c*ac.compra_x/(ac.compra_x+ac.bonif_y);
  return {costo:Math.round(c), acuerdo:ac, base};
}

// ================= AJUSTES Y MERMA =================
function vMerma(){
  const nm=s=>(SUCS.find(x=>x.id===s)||{}).nombre;
  // serie demo de merma mensual por cava (en la real: de los movimientos tipo ajuste)
  const serie=state.mermaHist||[];
  const CAUSAS={transferencia:['Transferencia no registrada','var(--teal)'],rotura:['Rotura','var(--rojo)'],
    consumo:['Consumo interno','var(--ambar)'],copa_calibre:['Calibre de copas','var(--indigo)'],
    venta_anulada:['Venta anulada','var(--gris)'],carga_doble:['Carga doble','var(--gris)'],otro:['Otro','var(--grisclaro)']};

  const ss=state.suc==='consolidado'?['guemes','warcalde','neper']:[state.suc];
  const ajustes=(state.ajustesHist||[]).filter(a=>ss.includes(a.suc));
  // merma real = todo menos transferencias (esas son error de registro, no pérdida)
  const mermaReal=ajustes.filter(a=>a.causa!=='transferencia').reduce((s,a)=>s+a.plata,0);
  const errorReg=ajustes.filter(a=>a.causa==='transferencia').reduce((s,a)=>s+a.plata,0);
  const porCausa={};
  for(const a of ajustes){ porCausa[a.causa]=(porCausa[a.causa]||0)+Math.abs(a.plata); }

  let html='<div class="secband"><div class="ico" style="background:var(--rojobg);color:var(--rojo)">▽</div>'
    +'<div><div class="st">Ajustes y merma</div><div class="ss">La plata que aparece o desaparece entre lo teórico y lo real — el control de fondo de la cava</div></div></div>';

  html+='<div class="titular" style="grid-template-columns:1fr 1fr 1fr">'
    +'<div class="tcard hero" style="background:var(--rojo);border-color:var(--rojo)"><div class="lbl">Merma real · año</div>'
    +'<div class="val">'+fmtM(mermaReal)+'</div><div class="det">pérdida efectiva: rotura, consumo, faltantes sin explicación</div></div>'
    +'<div class="tcard"><div class="lbl">Error de registro</div><div class="val" style="color:var(--teal)">'+fmtM(errorReg)+'</div><div class="det">transferencias no asentadas · no es pérdida, se corrige</div></div>'
    +'<div class="tcard"><div class="lbl">Ajustes en el período</div><div class="val">'+ajustes.length+'</div><div class="det">movimientos de ajuste registrados</div></div>'
    +'</div>';

  html+='<div class="nota info" style="margin-bottom:12px"><b>Merma real ≠ diferencia total.</b> Una transferencia no registrada genera una diferencia grande pero no es plata perdida: la botella existe, está en otra cava. Por eso se separan — mezclarlas inflaría la merma.</div>';

  // serie mensual por cava
  if(serie.length){
    html+='<section class="panel"><h2>Merma mes a mes</h2><div class="h2sub">Si un mes se dispara respecto de los otros, ahí hay algo que mirar</div>'
      +'<table><thead><tr><th>Mes</th><th class="num">Güemes</th><th class="num">Warcalde</th><th class="num">Neper</th><th class="num">Total</th></tr></thead><tbody>';
    for(const m of serie){
      const t=m.g+m.w+m.n;
      html+='<tr><td class="etq">'+m.mes+'</td><td class="num difneg">'+fmt$(m.g)+'</td><td class="num difneg">'+fmt$(m.w)+'</td><td class="num difneg">'+fmt$(m.n)+'</td><td class="num"><b class="difneg">'+fmt$(t)+'</b></td></tr>';
    }
    html+='</tbody></table></section>';
  }

  // desglose por causa
  const causasOrd=Object.entries(porCausa).sort((a,b)=>b[1]-a[1]);
  const totCausa=causasOrd.reduce((s,c)=>s+c[1],0);
  if(causasOrd.length){
    html+='<section class="panel"><h2>Merma por causa</h2><div class="h2sub">El patrón dice qué arreglar: si domina «rotura» es manipulación; si domina «calibre de copas» es sobre-servido; si domina «transferencia» es proceso, no pérdida</div>'
      +'<div class="stack" style="margin-bottom:14px">'
      + causasOrd.map(([c,v])=>{const pct=totCausa?v/totCausa*100:0;const col=(CAUSAS[c]||['',''])[1];
          return '<div style="width:'+pct+'%;background:'+col+'">'+(pct>=12?Math.round(pct)+'%':'')+'</div>';}).join('')
      +'</div><div class="leyenda">'
      + causasOrd.map(([c,v])=>{const info=CAUSAS[c]||[c,'var(--gris)'];
          return '<div class="lrow"><span class="pt" style="background:'+info[1]+'"></span>'
          +'<span class="lnom">'+info[0]+'</span><span class="lmonto">'+fmt$(v)+'</span></div>';}).join('')
      +'</div></section>';
  }

  // detalle auditable
  html+='<section class="panel"><h2>Detalle de ajustes</h2><div class="h2sub">Cada ajuste con su causa y quién lo hizo — trazabilidad completa</div>'
    +'<table><thead><tr><th>Fecha</th><th>Cava</th><th>Etiqueta</th><th class="num">Ajuste</th><th class="num">Plata</th><th>Causa</th><th>Responsable</th></tr></thead><tbody>';
  for(const a of ajustes.slice().sort((x,y)=>x.fecha<y.fecha?1:-1)){
    const info=CAUSAS[a.causa]||[a.causa,'var(--gris)'];
    html+='<tr><td>'+a.fecha+'</td><td>'+nm(a.suc)+'</td><td class="etq">'+esc(a.etq)+'</td>'
      +'<td class="num '+(a.cant>0?'difpos':'difneg')+'">'+(a.cant>0?'+':'')+a.cant+'</td>'
      +'<td class="num '+(a.plata>=0?'difpos':'difneg')+'">'+fmt$(a.plata)+'</td>'
      +'<td><span class="tag '+(a.causa==='transferencia'?'vidriera':(a.causa==='rotura'?'liquidar':'g'))+'">'+info[0]+'</span></td>'
      +'<td class="mini">'+esc(a.por||'—')+'</td></tr>';
  }
  html+='</tbody></table></section>';
  return html;
}

// Carga el estado desde Supabase. La vista cava_tablero ya trae stock/costo/margen/rotación
// calculados; acá los mapeamos a las estructuras que las vistas de la app ya usan.
async function cargarSupabase(){
  if(!sb) return false;
  try{
    const [tablero, cierres, acuerdos, transf, precioCopa, presu] = await Promise.all([
      sb.from('cava_tablero').select('*'),
      sb.from('cava_cierres_resumen').select('*').order('mes'),
      sb.from('cava_acuerdos').select('*').eq('activo',true),
      sb.from('cava_transferencias').select('*, cava_botellas(etiqueta)').order('fecha',{ascending:false}),
      sb.from('cava_precios_carta').select('botella_id,sucursal,precio').order('fecha',{ascending:false}),
      sb.from('cava_presupuestos').select('*')
    ]);
    if(tablero.error) throw tablero.error;
    const rows = tablero.data||[];
    if(!rows.length) return false;   // sin datos → mantener demo

    // reconstruir botellas / stock / ventas desde el tablero (una fila por botella×sucursal)
    const botMap=new Map(), stock={}, ventas={}, precio={}, pcopa={};
    for(const r of rows){
      if(!botMap.has(r.botella_id)) botMap.set(r.botella_id, {
        id:r.botella_id, etiqueta:r.etiqueta, bodega:r.bodega||'', cepa:r.cepa||'',
        costo:Number(r.costo_repo)||0, precio:{guemes:null,warcalde:null,neper:null}
      });
      const b=botMap.get(r.botella_id);
      b.precio[r.sucursal]=Number(r.precio_carta)||null;
      (stock[r.botella_id]=stock[r.botella_id]||{})[r.sucursal]=Number(r.stock)||0;
      (ventas[r.botella_id]=ventas[r.botella_id]||{})[r.sucursal]=Number(r.vendidas_30)||0;
    }
    state.botellas=[...botMap.values()];
    state.stock=stock; state.ventas=ventas;
    state.copas=state.copas||{}; state.precioCopa=state.precioCopa||{};

    // cierres → serie de valorización mensual
    if((cierres.data||[]).length){
      const porMes={};
      for(const c of cierres.data){ (porMes[c.mes]=porMes[c.mes]||{mes:c.mes,g:0,w:0,n:0})[{guemes:'g',warcalde:'w',neper:'n'}[c.sucursal]]=Number(c.valuacion)||0; }
      state.cierres=Object.values(porMes);
    }
    // acuerdos
    if((acuerdos.data||[]).length) state.acuerdos=acuerdos.data.map(a=>({
      bodega:a.bodega, tipo:a.tipo, cond:a.condicion, vig:a.hasta||'—', nota:a.nota||'', plata:null}));
    // transferencias
    if((transf.data||[]).length) state.transfHist=transf.data.map(t=>({
      fecha:t.fecha, origen:t.origen, destino:t.destino,
      etq:(t.cava_botellas&&t.cava_botellas.etiqueta)||'—', cant:t.cantidad, costo:Number(t.costo_unit)||0, detectada:t.detectada}));

    // presupuestos: los de la base pisan los demo (formato {mes, suc, monto})
    if((presu.data||[]).length){
      state.presupuestos = presu.data.map(p=>({mes:p.mes, suc:p.sucursal, monto:Number(p.monto)||0}));
    }

    state.demo=false;
    return true;
  }catch(e){ console.warn('Supabase no disponible, usando datos demo:', e.message); return false; }
}

// Guardar presupuesto del mes (upsert por mes+sucursal). Escribe en Supabase si hay conexión.
const MES_ACTUAL='2026-06';   // en producción: new Date().toISOString().slice(0,7)
async function guardarPresupuesto(suc, monto){
  const n=parseFloat(String(monto).replace(/\./g,'').replace(',','.'));
  if(isNaN(n)||n<0) return {ok:false, msg:'monto inválido'};
  const prev=state.presupuestos.find(p=>p.suc===suc && p.mes===MES_ACTUAL);
  if(prev) prev.monto=n; else state.presupuestos.push({mes:MES_ACTUAL, suc, monto:n});
  if(sb && !state.demo){
    const {error}=await sb.from('cava_presupuestos').upsert(
      {mes:MES_ACTUAL, sucursal:suc, monto:n}, {onConflict:'mes,sucursal'});
    if(error) return {ok:false, msg:'no se guardó en la base: '+error.message};
  }
  return {ok:true};
}
